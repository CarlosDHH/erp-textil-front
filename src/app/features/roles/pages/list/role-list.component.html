<div class="page-container">
  <p-toast />
  <p-confirmDialog />

  <div class="page-header">
    <h2>Roles</h2>
    <p-button label="Nuevo rol" icon="pi pi-plus" (onClick)="goToCreate()" />
  </div>

  <div class="search-bar">
    <input
      pInputText
      type="text"
      placeholder="Buscar por nombre..."
      [(ngModel)]="searchTerm"
      (keyup.enter)="onSearch()"
      class="search-input"
    />
    <p-button icon="pi pi-search" (onClick)="onSearch()" [outlined]="true" />
  </div>

  <p-table
    [value]="roles()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="limit"
    [totalRecords]="totalRecords()"
    [lazy]="true"
    (onPage)="onPageChange($event)"
    [rowsPerPageOptions]="[10, 20, 50]"
    styleClass="p-datatable-sm"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-role>
      <tr>
        <td>{{ role.name }}</td>
        <td>{{ role.description ?? '—' }}</td>
        <td>
          <p-tag
            [value]="role.isActive ? 'Activo' : 'Inactivo'"
            [severity]="getStatusSeverity(role.isActive)"
          />
        </td>
        <td>
          <div class="actions">
            <p-button
              icon="pi pi-pencil"
              [rounded]="true"
              [text]="true"
              severity="info"
              (onClick)="goToEdit(role.id)"
            />
            <p-button
              icon="pi pi-trash"
              [rounded]="true"
              [text]="true"
              severity="danger"
              (onClick)="confirmDelete(role)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="empty">
      <tr>
        <td colspan="4" class="empty-message">No se encontraron roles</td>
      </tr>
    </ng-template>
  </p-table>
</div>
