@if (user$ | async; as user) {
  <div class="welcome-container">

    <div class="welcome-card">
      <p-avatar
        [label]="getInitials(user.name, user.lastName)"
        styleClass="welcome-avatar"
        shape="circle"
        size="xlarge"
      />
      <div class="welcome-info">
        <h1>Hola, {{ user.name }} {{ user.lastName }}</h1>
        <p class="welcome-role">{{ user.role }}</p>
        <p class="welcome-email">{{ user.email }}</p>
      </div>
    </div>

    <div class="quick-links">
      <a routerLink="/admin/users" class="link-card">
        <i class="pi pi-users"></i>
        <span>Usuarios</span>
      </a>
      <a routerLink="/admin/roles" class="link-card">
        <i class="pi pi-shield"></i>
        <span>Roles</span>
      </a>
    </div>

  </div>
}
