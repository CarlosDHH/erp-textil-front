<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Lotes</h1>
      <p class="text-sm text-slate-500">Administra el registro y existencias de materias primas.</p>
    </div>
    <div class="flex items-center gap-3">
      <button
        pButton
        type="button"
        label="Descargar Reporte PDF"
        icon="pi pi-file-pdf"
        [loading]="exporting"
        (click)="exportPdf()"
        class="p-button-outlined text-red-600 border-red-200 hover:bg-red-50"></button>
      <button *appHasPermission="['lotes', 'canCreate']" pButton label="Nuevo Lote" icon="pi pi-plus" routerLink="new" class="bg-blue-600 hover:bg-blue-700 border-none"></button>
    </div>
  </div>

  <div class="card bg-white p-4 rounded-xl shadow-sm border border-slate-100">
    <div class="flex justify-between items-center mb-4">
      <!-- p-input-icon-left desapareció en PrimeNG 20 y el icono quedaba suelto
           a la izquierda del input; p-iconfield lo coloca dentro del campo. -->
      <p-iconfield class="w-full max-w-md">
        <p-inputicon class="pi pi-search" />
        <input pInputText type="text" (input)="onSearch($event)" placeholder="Buscar por número de lote..." class="w-full bg-gray-50 border-gray-300 rounded-lg" />
      </p-iconfield>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

  @for (batch of batches; track batch.id) {

    <app-batch-card
      [batch]="batch"
      (delete)="deleteBatch($event)">
    </app-batch-card>

  }
  @if (!loading && batches.length === 0) {

<div class="text-center py-16 text-slate-500">

    <i class="pi pi-inbox text-5xl mb-4"></i>

    <p>No hay lotes registrados.</p>

</div>

}

</div>
  </div>
</div>
