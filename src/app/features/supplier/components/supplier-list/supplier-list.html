<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Lista de proveedores</h1>
      <p class="text-sm text-slate-500">Administra el directorio y el estado de tus proveedores.</p>
    </div>
    <div class="flex items-center gap-3">
      <button
        pButton
        type="button"
        label="Descargar Reporte PDF"
        icon="pi pi-file-pdf"
        [loading]="exporting"
        (click)="exportPdf()"
        class="p-button-outlined text-red-600 border-red-200 hover:bg-red-50"></button>
      <button *appHasPermission="['proveedores', 'canCreate']" pButton label="Nuevo proveedor" icon="pi pi-plus" routerLink="new" class="bg-blue-600 hover:bg-blue-700 border-none"></button>
    </div>
  </div>

  <div class="card bg-white p-4 rounded-xl shadow-sm border border-slate-100">
    <div class="flex justify-between items-center mb-4">
      <!-- p-input-icon-left desapareció en PrimeNG 20; el icono debe ir dentro
           de p-iconfield/p-inputicon para quedar alineado dentro del campo. -->
      <p-iconfield class="w-full max-w-md">
        <p-inputicon class="pi pi-search" />
        <input pInputText type="text" (input)="onSearch($event)" placeholder="Buscar por nombre, RFC, correo o contacto..." class="w-full bg-gray-50 border-gray-300 rounded-lg" />
      </p-iconfield>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

  @for (supplier of suppliers; track supplier.id) {

    <app-supplier-card
      [supplier]="supplier"
      [togglingActive]="isToggling(supplier.id)"
      (toggleActive)="onToggleActive($event)"
      (delete)="deleteSupplier($event)">
    </app-supplier-card>

  }
  @if (!loading && suppliers.length === 0) {

<div class="text-center py-16 text-slate-500">

    <i class="pi pi-inbox text-5xl mb-4"></i>

    <p>No hay proveedores registrados.</p>

</div>

}

</div>
  </div>
</div>
