<div class="bg-white rounded-2xl shadow-sm border border-gray-200/80 p-5 flex flex-col h-full hover:shadow-md transition-shadow duration-200">
  
  <div class="flex justify-between items-start mb-4 gap-2">
    <span class="text-xs font-mono font-semibold text-gray-500 bg-gray-100 px-2.5 py-1 rounded-md border border-gray-200">
      {{ supply.code }}
    </span>
    <p-tag 
      [severity]="severity" 
      [value]="statusLabel" 
      styleClass="px-2 py-0.5 text-[10px] font-bold rounded-full uppercase tracking-wider">
    </p-tag>
  </div>

  <div class="mb-5 flex-grow">
    <h3 class="text-lg font-bold text-gray-800 leading-tight mb-2 line-clamp-2" [title]="supply.name">
      {{ supply.name }}
    </h3>
    <span class="inline-flex items-center gap-1.5 text-xs text-blue-700 bg-blue-50 px-2.5 py-1 rounded-md font-medium border border-blue-100">
      <i class="pi pi-tag text-[10px]"></i>
      {{ supply.type }}
    </span>
  </div>

  <div class="grid grid-cols-2 gap-3 mb-5 bg-gray-50 p-3.5 rounded-xl border border-gray-100">
    <div>
      <p class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold mb-1">Stock Actual</p>
      <div class="flex items-baseline gap-1">
        <span class="text-xl font-black" [ngClass]="stockColorClass">{{ supply.currentStock }}</span>
        <span class="text-xs font-medium text-gray-500">{{ supply.unitMeasure }}</span>
      </div>
    </div>
    <div class="border-l border-gray-200 pl-3">
      <p class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold mb-1">Mínimo</p>
      <span class="text-sm font-bold text-gray-700">{{ supply.minStock }}</span>
    </div>
  </div>

  <div class="flex gap-2 mt-auto pt-4 border-t border-gray-100">
    <button *appHasPermission="['insumos', 'canEdit']" pButton icon="pi pi-pencil" label="Editar"
      class="p-button-outlined p-button-sm flex-1 text-blue-600 border-blue-200 hover:bg-blue-50"
      [routerLink]="['/admin/supplies/edit', supply.id]">
    </button>
    <button *appHasPermission="['insumos', 'canDelete']" pButton icon="pi pi-trash" class="p-button-outlined p-button-sm w-10" (click)="onDelete()">
    </button>
  </div>
</div>
